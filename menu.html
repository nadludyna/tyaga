<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ТЯГА</title>
<style>
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(/fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* The tray icon's menu (Windows): a little window of ТЯГА's own instead of Windows' grey
   menu, in the same look as the main window: on top what's going on (the download now, how
   far, how many are left), then the actions with the same coloured icons as in the window.
   The window is transparent; the card is the menu. */
:root{color-scheme:dark;--card:#1a1a1c;--fg:#eee;--dim:#8a8a8a;--line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.07);--acc:#ff6b2c;--err:#ff6b6b;--ok:#51cf66;--folder:#f0b44c;--info:#79b0ff}
/* The theme the main window's button picked (data-theme), else Windows' own. */
:root[data-theme=light]{color-scheme:light;--card:#fff;--fg:#1b1b1b;--dim:#6f6f6f;--line:rgba(0,0,0,.09);--hover:rgba(0,0,0,.05);--acc:#e8590c;--err:#c92a2a;--ok:#2b8a3e;--folder:#c48412;--info:#2f6fd1}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--card:#fff;--fg:#1b1b1b;--dim:#6f6f6f;--line:rgba(0,0,0,.09);--hover:rgba(0,0,0,.05);--acc:#e8590c;--err:#c92a2a;--ok:#2b8a3e;--folder:#c48412;--info:#2f6fd1}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
body{font:13.5px/1.3 Onest,system-ui,sans-serif;color:var(--fg);padding:8px;display:flex;align-items:flex-end}
.menu{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 18px -6px rgba(0,0,0,.55);animation:in .14s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* On top: what's going on. An icon in the same style as the window's states, the download
   now (or that nothing is), and a line under it: how far, how many are left. */
.now{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.now svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--dim)}
.now.busy svg{color:var(--acc)}
.nt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.nt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.now.busy .nt span{color:var(--acc)}
.bar{position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:transparent}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc)}
button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-weight:500;text-align:left;cursor:default;transition:background .12s ease,color .12s ease,transform .1s ease}
button:hover,button:focus-visible{background:var(--hover);outline:none}
button:active{transform:scale(.98)}
button svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The words sit in the middle by the letters themselves, like in the main window. */
button>span{text-box:trim-both cap alphabetic;padding-block:.3em;margin-block:-.3em} /* room for the tails of у, р, g where a label is cut with "…" */
#open svg{color:var(--acc)}#folder svg{color:var(--folder)}#pick svg{color:var(--info)}.quit svg{color:var(--dim)}
.sep{height:1px;background:var(--line);margin:4px 6px}
.quit:hover,.quit:focus-visible{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
.quit:hover svg,.quit:focus-visible svg{color:var(--err)}
/* Quitting while something downloads: the question takes the menu's place, same size. */
.ask{display:none;padding:6px 6px 2px}
.ask p{margin:4px 4px 12px;font-size:12.5px;color:var(--dim)}
.ask p b{display:block;color:var(--fg);font-weight:600;font-size:13.5px;margin-bottom:4px}
.ask .row{display:flex;gap:6px}
.ask .row button{flex:1;justify-content:center;white-space:nowrap;border:1px solid var(--line)}
.ask .row .quit{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.asking .items{display:none}.asking .ask{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="menu" id="menu">
  <div class="items">
    <div class="now" id="now"><svg id="ni" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.2 9.5"/></svg><div class="nt"><b id="nt">&nbsp;</b><span id="ns">&nbsp;</span></div><div class="bar"><i id="nb"></i></div></div>
    <button id="open"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span data-t="Open ТЯГА">Open ТЯГА</span></button>
    <button id="folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="folderT">Open the downloads folder</span></button>
    <button id="pick"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"/><path d="M3 7v10a2 2 0 0 0 2 2h6.5"/><path d="M14.5 17.5h7m-3-3 3 3-3 3"/></svg><span data-t="Save downloads elsewhere…">Save downloads elsewhere…</span></button>
    <div class="sep"></div>
    <button id="quit" class="quit"><svg viewBox="0 0 24 24"><path d="M12 3v8M7 6a8 8 0 1 0 10 0"/></svg><span data-t="Quit ТЯГА">Quit ТЯГА</span></button>
  </div>
  <div class="ask">
    <p><b data-t="Something is still downloading.">Something is still downloading.</b><span data-t="Quit anyway? Unfinished files resume when you download them again.">Quit anyway? Unfinished files resume when you download them again.</span></p>
    <div class="row"><button id="keep"><span data-t="Keep going">Keep going</span></button><button id="quit2" class="quit"><span data-t="Quit">Quit</span></button></div>
  </div>
</div>
<script>
var TOKEN = new URLSearchParams(location.search).get('t'), busy = false;
function $(id) { return document.getElementById(id); }
// The language the main window's button picked (tyaga-lang), else Windows' own.
var RU = { 'Open ТЯГА': 'Открыть ТЯГУ', 'Save downloads elsewhere…': 'Сохранять в другую папку…',
  'Quit ТЯГА': 'Выйти из ТЯГИ', 'Something is still downloading.': 'Ещё что-то качается.',
  'Quit anyway? Unfinished files resume when you download them again.': 'Всё равно выйти? Недокачанное докачается, когда скачаешь снова.',
  'Keep going': 'Пусть качает', 'Quit': 'Выйти' }, ru = false;
function langNow() {
  var l = null; try { l = localStorage.getItem('tyaga-lang'); } catch (e) {}
  ru = l ? l === 'ru' : /^(ru|uk|be)/i.test(navigator.language || '');
  document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = ru && RU[e.dataset.t] || e.dataset.t; });
}
function tray(text) {
  return fetch('/api/tray', { method: 'POST', headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ text: text }) })
    .then(function (r) { return r.json(); });
}
var ICON = {
  busy: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/>',
  idle: '<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.2 9.5"/>'
};
// What's going on now: the download, how far it is, how many are left after it.
function showNow(s) {
  s = s || {};
  busy = s.busy > 0;
  var left = (s.busy || 1) - 1, p = Math.floor(s.progress || 0);
  $('now').classList.toggle('busy', busy);
  $('ni').innerHTML = busy ? ICON.busy : ICON.idle;
  $('nt').textContent = busy ? (s.title || '').replace(/^\[\d+\/\d+\] /, '').replace(/^https?:\/\/(www\.)?/, '')
    : ru ? 'Ничего не качается' : 'Nothing is downloading';
  $('ns').textContent = busy
    ? (ru ? 'Скачивается · ' + p + '%' + (left ? ' · ещё ' + left : '') : 'Downloading · ' + p + '%' + (left ? ' · ' + left + ' more' : ''))
    : (s.folder ? (ru ? 'Файлы — в папке ' + s.folder : 'Files go to ' + s.folder) : '');
  $('nb').style.width = busy ? p + '%' : '0';
  $('folderT').textContent = s.folder ? (ru ? 'Открыть папку ' + s.folder : 'Open ' + s.folder) : (ru ? 'Открыть папку загрузок' : 'Open the downloads folder');
  $('pick').hidden = s.canPick === false;
}
// Every time the menu shows: what's going on now, and the plain menu (not the question).
function fresh() {
  try { var t = localStorage.getItem('tyaga-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  document.body.classList.remove('asking');
  langNow();
  var m = $('menu'); m.style.animation = 'none'; void m.offsetWidth; m.style.animation = '';
  tray('busy').then(showNow, function () {});
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) fresh(); });
addEventListener('focus', fresh);
addEventListener('blur', function () { tray('hide'); }); // ТЯГА ignores this right after opening
addEventListener('keydown', function (e) { if (e.key === 'Escape') tray('hide'); });
addEventListener('contextmenu', function (e) { e.preventDefault(); });
$('open').onclick = function () { tray('open'); };
$('folder').onclick = function () { tray('folder'); };
$('pick').onclick = function () { tray('pick'); };
$('quit').onclick = function () { if (busy) { document.body.classList.add('asking'); $('keep').focus(); } else tray('quit'); };
$('keep').onclick = function () { tray('hide'); };
$('quit2').onclick = function () { tray('quit'); };
fresh();
</script></body></html>
