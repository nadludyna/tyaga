<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ТЯГА</title>
<style>
/* The tray icon's menu (Windows): a little window of ТЯГА's own instead of Windows' grey
   menu, in the same look as the main window. The window is transparent; the card is the menu. */
:root{color-scheme:dark;--card:#1a1a1c;--fg:#eee;--dim:#8a8a8a;--line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.07);--acc:#ff6b2c;--err:#ff6b6b}
/* The theme the main window's button picked (data-theme), else Windows' own. */
:root[data-theme=light]{color-scheme:light;--card:#fff;--fg:#1b1b1b;--dim:#6f6f6f;--line:rgba(0,0,0,.09);--hover:rgba(0,0,0,.05);--acc:#e8590c;--err:#c92a2a}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--card:#fff;--fg:#1b1b1b;--dim:#6f6f6f;--line:rgba(0,0,0,.09);--hover:rgba(0,0,0,.05);--acc:#e8590c;--err:#c92a2a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
body{font:13.5px/1.3 system-ui,sans-serif;color:var(--fg);padding:8px;display:flex;align-items:flex-end}
.menu{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 18px -6px rgba(0,0,0,.55);animation:in .14s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.now{padding:7px 10px 8px;color:var(--dim);font-size:12.5px;border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{color:var(--acc);font-weight:500}
button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:default;transition:background .12s ease,color .12s ease,transform .1s ease}
button:hover,button:focus-visible{background:var(--hover);outline:none}
button:active{transform:scale(.98)}
button svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.sep{height:1px;background:var(--line);margin:4px 6px}
.quit:hover,.quit:focus-visible{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
/* Quitting while something downloads: the question takes the menu's place, same size. */
.ask{display:none;padding:4px 6px 2px}
.ask p{margin:4px 4px 10px;font-size:12.5px;color:var(--dim)}
.ask p b{display:block;color:var(--fg);font-weight:500;font-size:13.5px;margin-bottom:3px}
.ask .row{display:flex;gap:6px}
.ask .row button{flex:1;justify-content:center;white-space:nowrap;border:1px solid var(--line)}
.ask .row .quit{color:var(--err)}
.asking .items{display:none}.asking .ask{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="menu" id="menu">
  <div class="items">
    <div class="now" id="now">&nbsp;</div>
    <button id="open"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>Open ТЯГА</button>
    <button id="folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open the downloads folder</button>
    <button id="pick"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v3"/><path d="M3 7v10a2 2 0 0 0 2 2h7"/><path d="M15 18.5l2 2 4-4.5"/></svg>Save downloads elsewhere…</button>
    <div class="sep"></div>
    <button id="quit" class="quit"><svg viewBox="0 0 24 24"><path d="M12 3v8M7 6a8 8 0 1 0 10 0"/></svg>Quit ТЯГА</button>
  </div>
  <div class="ask">
    <p><b>Something is still downloading.</b>Quit anyway? Unfinished files resume when you download them again.</p>
    <div class="row"><button id="keep">Keep going</button><button id="quit2" class="quit">Quit</button></div>
  </div>
</div>
<script>
var TOKEN = new URLSearchParams(location.search).get('t'), busy = false;
function $(id) { return document.getElementById(id); }
function tray(text) {
  return fetch('/api/tray', { method: 'POST', headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ text: text }) })
    .then(function (r) { return r.json(); });
}
// Every time the menu shows: what's going on now, and the plain menu (not the question).
function fresh() {
  try { var t = localStorage.getItem('tyaga-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  document.body.classList.remove('asking');
  var m = $('menu'); m.style.animation = 'none'; void m.offsetWidth; m.style.animation = '';
  tray('busy').then(function (s) {
    busy = s.busy > 0;
    $('now').innerHTML = s.busy ? '<b>Downloading</b> · ' + s.busy + (s.busy === 1 ? ' download' : ' downloads') + ' to go' : 'Nothing is downloading';
  }, function () {});
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) fresh(); });
addEventListener('focus', fresh);
addEventListener('blur', function () { tray('hide'); }); // ТЯГА ignores this right after opening
addEventListener('keydown', function (e) { if (e.key === 'Escape') tray('hide'); });
addEventListener('contextmenu', function (e) { e.preventDefault(); });
$('open').onclick = function () { tray('open'); };
$('folder').onclick = function () { tray('folder'); };
$('pick').onclick = function () { tray('pick'); };
$('quit').onclick = function () { if (busy) { document.body.classList.add('asking'); $('keep').focus(); } else tray('quit'); };
$('keep').onclick = function () { tray('hide'); };
$('quit2').onclick = function () { tray('quit'); };
fresh();
</script></body></html>
