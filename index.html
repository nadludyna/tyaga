<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТЯГА</title>
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"%3E %3Crect width="256" height="256" rx="58" fill="%23161616"/%3E %3Cpath d="M176 0 V22" stroke="%238a96a3" stroke-width="6"/%3E %3Ccircle cx="176" cy="36" r="12" fill="none" stroke="%23fff" stroke-width="9"/%3E %3Cpath d="M176 48 V170 A40 40 0 0 1 96 170 V40" fill="none" stroke="%23fff" stroke-width="18"/%3E %3Cpath d="M85 42 L96 10 L107 42 Z" fill="%23fff"/%3E %3Cpath d="M103 36 L119 54" stroke="%23fff" stroke-width="9.9" stroke-linecap="round"/%3E %3Cg fill="%23161616" stroke="%23161616" stroke-width="12" stroke-linejoin="round"%3E %3Cellipse cx="100" cy="124" rx="54" ry="47"/%3E %3Cpath d="M60 124 L24 86.4 Q33.9 124 24 161.6 Z"/%3E %3C/g%3E %3Cg fill="%23ff6b2c" stroke="%23ff6b2c" stroke-width="2" stroke-linejoin="round"%3E %3Cellipse cx="100" cy="124" rx="54" ry="47"/%3E %3Cpath d="M60 124 L24 86.4 Q33.9 124 24 161.6 Z"/%3E %3C/g%3E %3Cpath d="M83.143 108.208 L83.143 139.792 L111.76599999999999 124 Z" fill="%23fff" stroke="%23fff" stroke-width="5.922" stroke-linejoin="round"/%3E %3Ccircle cx="131.32" cy="109.9" r="6" fill="%23161616"/%3E %3C/svg%3E'>
<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--card:rgba(255,255,255,.93);--fg:#1b1b1b;--dim:#6f6f6f;--line:rgba(0,0,0,.09);--acc:#e8590c;--acc2:#ff922b;--ok:#2b8a3e;--err:#c92a2a;--glow:rgba(232,89,12,.28)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f10;--card:rgba(26,26,28,.94);--fg:#eee;--dim:#8a8a8a;--line:rgba(255,255,255,.08);--acc:#ff6b2c;--acc2:#ffa94d;--ok:#51cf66;--err:#ff6b6b;--glow:rgba(255,107,44,.35)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* The scrollbar's place is kept even without one, so the page doesn't shift sideways when the list gets long. */
html{min-height:100%;scrollbar-gutter:stable}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;overflow-x:hidden}
/* An app, not a document: Ctrl+A or a stray click doesn't paint the buttons and labels blue.
   What's worth copying stays selectable: the links box, download titles, errors and the log. */
body{-webkit-user-select:none;user-select:none}
textarea,.name,.sub,.log{-webkit-user-select:text;user-select:text}

/* Background: notes and play signs slowly falling (canvas, drawn in the script), a faint glow at the top. */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--glow),transparent 70%)}
.bg canvas{width:100%;height:100%;display:block}
/* A download finished: the fish jumps on the hook. */
body.caught .logo .catch{animation:jump .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes jump{0%{transform:none}35%{transform:translateY(-18px) rotate(-10deg)}70%{transform:translateY(3px) rotate(4deg)}100%{transform:none}}
.job.just{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--ok) 22%,transparent)}100%{background:transparent}}

main{max-width:760px;margin:0 auto;padding:56px 18px 40px}
header{display:flex;align-items:center;gap:16px;margin:0 0 26px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.logo{width:58px;height:58px;flex:none;border-radius:15px;box-shadow:0 10px 30px -8px var(--glow),0 0 0 1px var(--line);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.logo:hover{transform:rotate(-6deg) scale(1.06)}
.logo .catch{transform-origin:176px 0;animation:bob 3.2s ease-in-out infinite}
.logo .fish{transform-origin:100px 124px}
body.busy .logo .catch{animation:reel 1.1s ease-in-out infinite}
body.busy .logo .fish{animation:wiggle .35s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(1.5deg)}}
@keyframes reel{0%,100%{transform:translateY(4px) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes wiggle{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
h1{font-size:24px;letter-spacing:.42em;margin:0;font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--fg) 30%,var(--acc) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
.tag{font-size:13px;color:var(--dim);margin-top:4px}
.tag small{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 50px -30px rgba(0,0,0,.6);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card+.card{margin-top:16px}
main>.card:nth-of-type(2){animation-delay:.08s}main>.card:nth-of-type(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.note{border-color:var(--acc);font-size:14px;white-space:pre-line}
.note.err{border-color:var(--err);color:var(--err)}

textarea{width:100%;min-height:90px;resize:vertical;background:rgba(127,127,127,.06);color:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
body.drop textarea{border-color:var(--acc);border-style:dashed;box-shadow:0 0 0 4px var(--glow)}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(127,127,127,.05)}
.seg button{border:0;background:transparent;color:inherit;padding:5px 12px;cursor:pointer;font:inherit;font-size:13.5px;transition:background .15s ease,color .15s ease,transform .1s ease}
.seg button:hover:not(.on){background:rgba(127,127,127,.12)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0c04;font-weight:600;box-shadow:none}
label{color:var(--dim);cursor:pointer;user-select:none;transition:color .2s}
label:hover{color:var(--fg)}
input[type=checkbox]{accent-color:var(--acc);transition:transform .15s}
input[type=checkbox]:active{transform:scale(.8)}
/* Options: switches on one line (pushed to both edges), checkboxes as chips that fill the width. */
/* Both switches stretch to fill the line, every button the same width (grow = number of buttons). */
/* Fixed columns, so nothing moves when a switch flips: Video/Audio always takes a third,
   the switch next to it (4 qualities or 2 formats) two thirds; the checkboxes, equal columns. */
.opts{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.opts .seg{display:flex}
.opts .seg button{flex:1;padding-left:6px;padding-right:6px}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.chips{grid-auto-flow:row;grid-template-columns:1fr 1fr}}
.chip{min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(127,127,127,.05);font-size:13.5px;white-space:nowrap;cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease,transform .1s ease}
.chip:hover{border-color:rgba(127,127,127,.35);background:rgba(127,127,127,.1)}
.chip:active{transform:scale(.97)}
.chip:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--fg)}
.chip:has(input:disabled){opacity:.38;cursor:default;border-color:var(--line);background:transparent;color:var(--dim)}
.cutrow:has(.times[hidden]){display:none}
.cutrow{justify-content:center}
.input{display:flex;gap:12px;align-items:stretch}
.input textarea{flex:1}
@media (max-width:560px){.input{flex-direction:column}.input .go{padding:12px}}
/* Every button answers the same calm way: a little lighter under the mouse, a little smaller
   while pressed. No jumps, no flashes. */
.go{flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0c04;border:0;border-radius:10px;padding:9px 26px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 22px -8px var(--glow);transition:filter .15s ease,transform .1s ease}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.97);filter:brightness(.95)}
.msg{color:var(--err);margin-top:8px;font-size:14px}
.msg:empty{margin:0}

.job{padding:13px 0;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job.new{animation:slide .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
/* A row: the cover of the finished file on the left (only once it's done: while downloading
   the video's thumbnail isn't what ends up in the file), then title, what it is, and state. */
.job{display:flex;gap:14px;align-items:center;border-radius:10px}
.job .body{flex:1;min-width:0}
.cover{flex:none;width:58px;height:58px;border-radius:9px;object-fit:cover;background:var(--line);box-shadow:0 0 0 1px var(--line);opacity:0;transform:scale(.9);transition:opacity .4s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.cover.wide{width:96px;height:54px}
.cover.ok{opacity:1;transform:none}
/* Same place as the cover, for rows that have none: queued, failed, cancelled, or a file
   without a picture. Keeps every row's text in one column. */
.ph{flex:none;width:58px;height:58px;border-radius:9px;display:grid;place-items:center;background:rgba(127,127,127,.08);box-shadow:0 0 0 1px var(--line);color:var(--dim)}
.ph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.job.error .ph{color:var(--err);background:color-mix(in srgb,var(--err) 9%,transparent)}
.name.link{color:var(--dim)}
.top{display:flex;gap:10px;align-items:baseline}
.kind{font-size:12.5px;color:var(--dim);margin-top:1px}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12.5px;color:var(--dim);white-space:nowrap;font-weight:500}
.st.running{color:var(--acc)}.st.waiting{color:var(--dim)}
/* While downloading (like Morphe): the state in colour under the title, and the track and
   percent as pills on the right. The pills have a fixed width so they don't jiggle. */
.kind .now{color:var(--acc);font-weight:500}
.kind .now.waiting{color:var(--dim)}
.pills{display:flex;gap:6px;flex:none}
.pill{min-width:54px;text-align:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.pill.all{min-width:96px}
.st.done{color:var(--ok)}.st.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.st.error{color:var(--err)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* Progress: a sine wave that runs faster the faster the download goes (drawn in the script). */
.wave{display:block;width:100%;height:18px;margin-top:6px}
/* The steps, as a small vertical timeline on a quiet panel: done steps get a tick in a
   circle, the current one an orange dot that breathes, joined by a thin line. The live
   numbers of the current step (part 17 of 80 · 8 MB so far) are little pills, like the counters
   above. New steps slide in, old ones fold away at the top. */
/* Fixed height (four steps), the newest step always on the bottom line: the panel never
   grows or shrinks while steps come and go, so nothing below it moves. Older steps leave
   over the top edge. */
.log{margin-top:8px;padding:8px 12px 8px 10px;height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border-radius:12px;background:rgba(127,127,127,.06);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;line-height:1.5;color:var(--dim)}
.log div{flex:none;position:relative;display:flex;align-items:center;gap:6px;min-height:24px;padding-left:24px;white-space:nowrap;overflow:hidden;max-height:24px;transition:opacity .35s,max-height .35s,min-height .35s}
.log div > span:first-child{overflow:hidden;text-overflow:ellipsis}
.log div::before{content:"";position:absolute;left:4px;top:7px;width:10px;height:10px;border-radius:50%;box-sizing:border-box}
.log div:not(:last-child)::after{content:"";position:absolute;left:8.5px;top:19px;height:12px;width:1px;background:var(--line)}
.log .done::before{background:color-mix(in srgb,var(--ok) 22%,transparent);border:1px solid color-mix(in srgb,var(--ok) 55%,transparent)}
.log .done{opacity:.7}
.log .done > span:first-child::after{content:" ✓";color:var(--ok);font-size:11px}
.log .cur{color:var(--fg)}
.log .cur::before{background:var(--acc);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 0%,transparent)}}
.log .tag{flex:none;padding:0 8px;border-radius:999px;font-size:11.5px;line-height:18px;font-variant-numeric:tabular-nums;color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.log .in{animation:stepin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes stepin{from{opacity:0;max-height:0;min-height:0}to{opacity:1;max-height:24px;min-height:24px}}
.log .out{opacity:0;max-height:0;min-height:0}
.sub{font-size:12px;color:var(--dim);margin-top:4px;word-break:break-word}
/* The speed line under the wave stays one line, whatever the width. */
.live .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.err{color:var(--err)}
.sub a{color:var(--acc);display:block;margin-top:2px}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.foot .play{margin-left:auto;min-width:150px;justify-content:center}
/* Buttons: soft pills with an icon; the accent one is for the thing you most likely want. */
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:rgba(127,127,127,.07);color:var(--fg);font:inherit;font-size:13px;line-height:1.2;cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease,transform .1s ease}
.btn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.btn:hover{border-color:rgba(127,127,127,.4);background:rgba(127,127,127,.14)}
.btn:active{transform:scale(.97)}
.btn.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.btn.acc:hover{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc)}
.btn.ghost{color:var(--dim)}
.btn.ghost:hover{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

.empty{color:var(--dim);text-align:center;padding:26px 0 18px}
.empty svg{display:block;margin:0 auto 10px;width:44px;height:44px;opacity:.35;animation:bob 3.2s ease-in-out infinite}
.times{color:var(--dim);display:inline-flex;gap:6px;align-items:center;animation:rise .3s both}
.times input{width:58px;background:rgba(127,127,127,.06);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 4px 5px 8px;font:inherit;font-variant-numeric:tabular-nums;outline:none;transition:border-color .2s,box-shadow .2s}
.times input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.times b{font-weight:400;margin:0 -3px}
/* Hints: anything with data-tip shows a bubble on hover (the page turns title="" into data-tip). */
.form{z-index:2}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:10;width:max-content;max-width:280px;padding:8px 11px;border-radius:9px;background:#232325;color:#eee;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px -10px rgba(0,0,0,.6);font:12.5px/1.45 system-ui,sans-serif;letter-spacing:0;text-align:left;white-space:normal;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;transition-delay:0s}
[data-tip]:hover::after{opacity:1;transform:none;transition-delay:.25s}
.seg button[data-tip]::after{left:50%;transform:translate(-50%,-4px)}
.seg button[data-tip]:hover::after{transform:translate(-50%,0)}
.seg{overflow:visible}.seg button:first-child{border-radius:9px 0 0 9px}.seg button:last-child{border-radius:0 9px 9px 0}
[data-tip].tip-left::after{left:auto;right:0}
.foot [data-tip]::after{top:auto;bottom:calc(100% + 8px)}

/* Signing in to YouTube (ТЯГА's own window on Windows): one button on the right of the header.
   It keeps one width whatever it says, so nothing next to it moves. */
header{position:relative;z-index:3}
.acct{margin-left:auto;flex:none;min-width:196px;justify-content:center;app-region:no-drag;-webkit-app-region:no-drag;--wails-draggable:no-drag}
.acct.in{color:var(--ok)}
.acct.in:hover{color:var(--fg)}
.acct.arm{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}
.acct.wait{color:var(--dim);cursor:default}
.acct.wait svg{animation:breathe2 1.6s ease-in-out infinite}
@keyframes breathe2{0%,100%{opacity:.8}50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* In ТЯГА's own window (Windows) the window is the cards themselves: no frame, no background,
   the desktop shows around them. The logo and the window buttons sit in the first card; its top
   row and the gaps between the cards drag the window (Windows' own dragging: double-click,
   snapping). The window has a fixed size: the download list scrolls inside its card, nothing
   grows. The falling notes live in the list card, the glow in the first one. */
.wbtns{display:none}
html.app,html.app body{background:transparent}
html.app{--card:#1a1a1c}
@media (prefers-color-scheme:light){html.app{--card:#fff}}
html.app body{position:fixed;inset:0;min-height:0;overflow:hidden;app-region:drag;-webkit-app-region:drag;--wails-draggable:drag}
html.app main{max-width:none;height:100%;margin:0;padding:12px 14px 16px;display:flex;flex-direction:column}
html.app .card{flex:none;app-region:no-drag;-webkit-app-region:no-drag;--wails-draggable:no-drag;box-shadow:0 6px 18px -8px rgba(0,0,0,.55)}
html.app .card+.card{margin-top:12px}
html.app .card.form{background:radial-gradient(ellipse 70% 90% at 12% -30%,var(--glow),transparent 65%),var(--card)}
html.app header{margin:-4px -6px 16px 0;animation:none;app-region:drag;-webkit-app-region:drag;--wails-draggable:drag}
html.app header .logo{width:46px;height:46px;border-radius:12px;app-region:no-drag;-webkit-app-region:no-drag;--wails-draggable:no-drag}
html.app header h1{font-size:22px}
html.app .wbtns{display:flex;gap:2px;margin-left:auto;align-self:flex-start}
html.app .acct{align-self:flex-start;margin-top:2px}
html.app .acct:not([hidden])+.wbtns{margin-left:8px}
.wbtns button{app-region:no-drag;-webkit-app-region:no-drag;--wails-draggable:no-drag;width:34px;height:30px;border:0;border-radius:8px;padding:0;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:default;transition:background .15s,color .15s}
.wbtns button:hover{background:var(--line);color:var(--fg)}
.wbtns button.x:hover{background:#c42b1c;color:#fff}
.wbtns svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.3}
html.app #jobsCard{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
html.app #jobsCard.gaming{flex:1}
html.app #jobsCard>*{position:relative;z-index:1}
html.app #list{flex:0 1 auto;min-height:0;overflow-y:auto;margin-right:-10px;scrollbar-gutter:stable}
html.app #jobsCard>.bg{position:absolute;inset:0;z-index:0;background:none;border-radius:inherit;overflow:hidden}
/* The list card folds to one line (what's going on + an arrow), and the window shrinks with it.
   It folds when the list is empty and unfolds when a link goes in; the arrow does it by hand. */
.lhead{display:none}
html.app .lhead{display:flex;align-items:center;gap:10px;width:100%;flex:none;margin:-4px 0 0;padding:2px 4px;border:0;border-radius:8px;background:transparent;color:var(--dim);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;transition:color .15s}
html.app .lhead:hover{color:var(--fg)}
.lhead #lsum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lhead .bad{color:var(--err)}.lhead .good{color:var(--ok)}
.lhead svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .25s}
html.app #jobsCard.folded .lhead svg{transform:rotate(180deg)}
html.app #jobsCard.folded{flex:none}
html.app #jobsCard #list,html.app #jobsCard #game,html.app #jobsCard .foot{transition:opacity .2s}

</main><script>
var TOKEN = new URLSearchParams(location.search).get('t');
// In ТЯГА's own window (see html.app in the styles): the logo goes into the first card,
// the falling notes into the list card, and the window buttons work.
if (new URLSearchParams(location.search).get('w')) {

    document.getElementById('w' + b).onclick = function () { api('/api/window', { text: b.toLowerCase() }); };
  });
}
var LABEL = { queued: 'queued', running: 'downloading', done: 'done', error: 'error', cancelled: 'cancelled' };
var state = {}, OFFLINE = 'ТЯГА is not responding. Start the program again.';

function $(id) { return document.getElementById(id); }

}

function api(path, body) {

    body: body ? JSON.stringify(body) : undefined,

    return r.json();

}

// A switch made of several buttons: returns a function that gives the selected value.
// With an argument it selects that value (used to restore the saved settings).
function segmented(id, onChange) {
  var value = $(id).querySelector('.on').dataset.v;
  function pick(b) {
    value = b.dataset.v;
    $(id).querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    if (onChange) onChange(value);
    save();
  }
  $(id).querySelectorAll('button').forEach(function (b) { b.onclick = function () { pick(b); }; });
  return function (v) {
    var b = v != null && $(id).querySelector('[data-v="' + v + '"]');
    if (b) pick(b);

  };

// Native title tooltips are slow and tiny: turn them into the styled data-tip bubbles.
document.querySelectorAll('main [title]').forEach(function (e) {

  e.addEventListener('mouseenter', function () {

var mode = segmented('mode', function (m) {
  document.querySelectorAll('[data-for]').forEach(function (e) { e.hidden = e.dataset.for !== m; });
});
var format = segmented('format');
var quality = segmented('quality');
var BOXES = ['playlist', 'merge', 'split', 'edit', 'sponsors'];

// The switches are remembered in this browser. Storage may be unavailable (private mode),
// then they just start from the defaults.
var restoring = true;
function save() {
  if (restoring) return;
  var s = { mode: mode(), format: format(), quality: quality() };
  BOXES.forEach(function (id) { s[id] = $(id).checked; });
  try { localStorage.setItem('tyaga', JSON.stringify(s)); } catch (e) {}
}
function restore() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem('tyaga')); } catch (e) {}
  if (s) {
    mode(s.mode); format(s.format); quality(s.quality);
    BOXES.forEach(function (id) { if (typeof s[id] === 'boolean') $(id).checked = s[id]; });
  }
  restoring = false;
}
BOXES.forEach(function (id) { $(id).addEventListener('change', save); });

// "As one file" only makes sense for a playlist; and then splitting by chapters doesn't.
// A fragment is for one video, not a playlist.
function syncBoxes() {
  var list = $('playlist').checked, cut = !list && $('cut').checked;
  $('mergeBox').hidden = !list;
  $('cutBox').hidden = list;
  $('cutTimes').hidden = !cut;
  $('split').disabled = (list && $('merge').checked) || cut;
}
$('playlist').onchange = $('merge').onchange = $('cut').onchange = syncBoxes;
restore();
syncBoxes();

// Fragment times: two counters each, minutes and seconds. Seconds roll over into minutes
// (0:59 ↑ → 1:00, 1:00 ↓ → 0:59), Shift + arrow steps by 10.
var TIMES = ['fromM', 'fromS', 'toM', 'toS'];

function rollover(m, s) {
  var mm = $(m), ss = $(s);
  if (ss.value === '' && mm.value === '') return;
  var total = Math.max(0, Math.floor(+mm.value || 0) * 60 + Math.floor(+ss.value || 0));
  mm.value = Math.floor(total / 60);
  ss.value = pad(total % 60);
}
[['fromM', 'fromS'], ['toM', 'toS']].forEach(function (p) {
  p.forEach(function (id) {
    $(id).addEventListener('change', function () { rollover(p[0], p[1]); });
    $(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); add(); return; }
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      var step = (e.shiftKey ? 10 : 1) * (e.key === 'ArrowUp' ? 1 : -1);

      rollover(p[0], p[1]);
    });

});
// "m:ss" for the server, or "" when both counters are empty (= start / end).
function timeOf(m, s) {
  if ($(m).value === '' && $(s).value === '') return '';
  return Math.floor(+$(m).value || 0) + ':' + pad(Math.floor(+$(s).value || 0));
}

// The switches as they are now, for /api/add.
function options(text) {
  var list = $('playlist').checked, cut = !list && $('cut').checked;
  return {
    text: text, mode: mode(), format: format(),
    quality: +quality(), playlist: list, split: $('split').checked, edit: $('edit').checked,
    merge: list && $('merge').checked, sponsors: $('sponsors').checked,
    from: cut ? timeOf('fromM', 'fromS') : '', to: cut ? timeOf('toM', 'toS') : '',
  };
}

function add() {
  var text = $('links').value.trim();
  if (!text) return;
  api('/api/add', options(text)).then(function (r) {
    $('msg').textContent = r.error || '';
    if (!r.error) { // a fragment is a one-off: the next link is whole again
      $('links').value = '';
      TIMES.forEach(function (id) { $(id).value = ''; });
      $('cut').checked = false;
      syncBoxes();
    }
    refresh();
  }, function () { $('msg').textContent = OFFLINE; });

$('go').onclick = function () { askNotify(); add(); };

// Ctrl+A anywhere outside a text field selects the links, not the whole page.
addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    $('links').focus(); $('links').select();

});

// Drag a link (from the address bar, a YouTube page, a chat) anywhere onto the page: it lands in the box.
var dragDepth = 0;
addEventListener('dragenter', function (e) { if (++dragDepth === 1) document.body.classList.add('drop'); e.preventDefault(); });
addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drop'); } });
addEventListener('dragover', function (e) { e.preventDefault(); });
addEventListener('drop', function (e) {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('drop');
  var t = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '')
    .split(/\s+/).filter(function (l) { return /^https?:\/\//.test(l); }).join('\n');
  if (!t) return;
  var box = $('links');
  box.value = box.value.trim() ? box.value.trim() + '\n' + t : t;
  box.focus();

// In ТЯГА's own window (WebView2) a right-click gives only what an app needs: copy and paste
// in text, not the browser's Back / Reload / Print.
if (window.chrome && window.chrome.webview) addEventListener('contextmenu', function (e) {
  if (!e.target.closest('textarea,input,.name,.sub,.log') && !String(getSelection())) e.preventDefault();
});
$('links').onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askNotify(); add(); } };
$('open').onclick = function () { api('/api/open', {}); };
$('clear').onclick = function () { api('/api/clear', {}).then(refresh); };

// Closing or reloading the page: tell TYAGA. If no page comes back, it finishes
// the downloads and quits by itself.
addEventListener('pagehide', function () {

});


// In a playlist: "video" or "track", and how far the current one is (the progress counts the
// whole playlist: video 3 of 12 half done is 21 %).
function itemWord(j) { return j.mode === 'audio' ? 'track' : 'video'; }
function itemPct(j) {
  if (!(j.of > 1 && j.pos)) return null;
  return Math.max(0, Math.min(100, Math.floor((j.progress / 100 * j.of - (j.pos - 1)) * 100)));
}

// What the download is: "Audio · MP3", "Video · MP4 · 1080p", plus fragment / one file.
function kindText(j) {
  var k = (j.channel ? j.channel + ' · ' : '') +
    (j.mode === 'audio' ? 'Audio · ' + j.format.toUpperCase() : 'Video · MP4' + (j.quality ? ' · ' + j.quality + 'p' : ''));
  if (j.merge && j.list) k += ' · one file';
  if (j.from || j.to) k += ' · ✂ ' + (j.from || '0:00') + '–' + (j.to || 'end');
  return k;
}
function statusText(j) {
  if (j.status === 'done') return '✓ Done';
  if (j.status === 'running' && j.wait > 0) return 'waiting';
  // Downloaded, now yt-dlp converts it, joins the picture and the sound or adds the cover.
  var now = (j.log || [])[(j.log || []).length - 1] || '';
  if (j.status === 'running' && !j.speed && /^(Converting|Joining|Adding the cover)/.test(now)) return 'converting';
  // The file is at 100%, but yt-dlp is still working: converting, merging or embedding the cover.
  if (j.status === 'running' && j.progress >= 100) return 'finishing';
  if (j.status === 'queued' && !state.ready) return 'waiting for setup';
  return LABEL[j.status];
}

// A system notification when a download finishes or fails while you're in another tab or window.
// Permission is asked once, on the first Download click (browsers only allow asking after a click).
var lastStatus = {}, caught = [];
function ping(jobs) {
  jobs.forEach(function (j) {
    var was = lastStatus[j.id];
    lastStatus[j.id] = j.status;
    if (was !== 'running' || (j.status !== 'done' && j.status !== 'error')) return;
    if (j.status === 'done') caught.push(j.id);
    // While the game is open, the list's top line says it for a few seconds.
    if (game.open) headNote = { t: (j.status === 'done' ? '✓ Downloaded: ' : 'Failed: ') + (j.title || 'a download').replace(/^\[\d+\/\d+\] /, ''), bad: j.status !== 'done', until: Date.now() + 5000 };
    if (!document.hidden || !window.Notification || Notification.permission !== 'granted') return;
    try {
      var n = new Notification(j.status === 'done' ? 'Done ✓' : 'Failed', {
        body: j.title || j.url, icon: document.querySelector('link[rel=icon]').href, tag: 'tyaga' + j.id,

var rows = {}; // job id → its row and the parts of it
// In ТЯГА's window the window follows the rows' height (see windowFit).

function button(cls, label, title, onclick) {

}

function makeRow(j) {
  var r = { row: el('div', 'job new'), body: el('div', 'body'), top: el('div', 'top') };
  r.row.dataset.id = j.id;
  r.name = el('span', 'name');
  r.st = el('span', 'st');
  r.pills = el('span', 'pills');
  r.pillTrack = el('span', 'pill');
  r.pillPct = el('span', 'pill tip-left');

  r.top.append(r.name, r.st, r.pills);

  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.9-5 7-5s5.8 1.7 7 5"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

function updateRow(r, j) {
  // Left of the text: the cover of the finished file (the real album art or the thumbnail,

    pad.w = Math.max(70, Math.min(110, W / 8));
    pad.y = H - 26;
    if (oldW) pad.x = pad.x / oldW * W; else pad.x = (W - pad.w) / 2;
    pad.x = Math.max(0, Math.min(W - pad.w, pad.x));
    if (ball.stuck) stick();
    return true;
  }
  function newBricks() {
    bricks = [];
    for (var i = 0; i < COLS * ROWS; i++) bricks.push({ alive: true, fade: 0 });
    layout();
  }
  function stick() { ball.stuck = true; ball.x = pad.x + pad.w / 2; ball.y = pad.y - ball.r - 1; }
  function launch() {
    var a = (Math.random() - 0.5) * 0.6; // a little to the side, never straight up
    ball.stuck = false; ball.vx = speed() * Math.sin(a); ball.vy = -speed() * Math.cos(a);
  }
  function restart() { lives = 3; score = 0; level = 1; newBricks(); stick(); }
  function click() {
    if (mode === 'over') { restart(); mode = 'ready'; return; }
    if (mode === 'ready' || mode === 'paused') { mode = 'play'; if (ball.stuck) launch(); }
    else if (mode === 'play' && ball.stuck) launch();
  }
  function pause() { if (mode === 'play') mode = 'paused'; }

  function step(dt) {
    var kv = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    if (kv) { pad.x = Math.max(0, Math.min(W - pad.w, pad.x + kv * 560 * dt)); aim = null; }
    else if (aim != null) pad.x += (aim - pad.x) * Math.min(1, dt * 22);
    bricks.forEach(function (b) { if (b.fade > 0) b.fade = Math.max(0, b.fade - dt / 0.18); });
    if (mode !== 'play') { if (ball.stuck) stick(); return; }
    if (ball.stuck) { stick(); return; }
    var n = Math.ceil(speed() * dt / 3), h = dt / n;
    for (var k = 0; k < n; k++) {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      // The paddle: where it hits says where it goes (the middle up, the edges to the side).
      if (ball.vy > 0 && ball.y + ball.r >= pad.y && ball.y - ball.r <= pad.y + pad.h &&
          ball.x >= pad.x - ball.r && ball.x <= pad.x + pad.w + ball.r) {
        var off = Math.max(-1, Math.min(1, (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2))), a = off * 1.05;
        ball.vx = speed() * Math.sin(a); ball.vy = -speed() * Math.cos(a);
        ball.y = pad.y - ball.r;
      }
      if (ball.y - ball.r > H) { // missed
        if (--lives <= 0) { mode = 'over'; lives = 0; }
        stick();
        if (mode === 'play') mode = 'ready';
        return;
      }
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;
        var nx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        var dx = ball.x - nx, dy = ball.y - ny;
        if (dx * dx + dy * dy > ball.r * ball.r) continue;
        b.alive = false; b.fade = 1;
        score += 10 * (ROWS - Math.floor(i / COLS));
        // Off the side it went into less deeply.
        var px = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var py = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (px < py) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        break;
      }
      if (!bricks.some(function (b) { return b.alive; })) { level++; newBricks(); stick(); mode = 'ready'; return; }
    }
  }

  function text(t, x, y, size, color, align) {
    cx.font = size + 'px system-ui,sans-serif'; cx.fillStyle = color; cx.textAlign = align || 'center';
    cx.fillText(t, x, y);
  }
  function rrect(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); cx.fill(); }
  function draw() {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    cx.textBaseline = 'middle';
    // A soft rainbow, one colour a row (pastel in the dark theme, deeper in the light one).
    var light = matchMedia('(prefers-color-scheme: light)').matches;
    var ROW = light ? ['#e57373', '#ffa726', '#f9c22e', '#66bb6a', '#42a5f5'] : ['#ff8a80', '#ffb74d', '#ffe082', '#a5d6a7', '#90caf9'];
    bricks.forEach(function (b, i) {
      if (!b.alive && !b.fade) return;
      var f = b.alive ? 1 : b.fade, s = b.alive ? 0 : (1 - f) * 3;
      cx.globalAlpha = 0.9 * f; cx.fillStyle = ROW[Math.floor(i / COLS)];
      rrect(b.x + s, b.y + s / 2, b.w - 2 * s, b.h - s, 4);
    });
    cx.globalAlpha = 0.85; cx.fillStyle = fg; rrect(pad.x, pad.y, pad.w, pad.h, 5);
    cx.globalAlpha = 1; cx.beginPath(); cx.arc(ball.x, ball.y, ball.r, 0, 7); cx.fill();
    text('Level ' + level + '   Score ' + score, SIDE, 17, 12.5, dim, 'left');
    text('Balls left ' + lives, W - SIDE, 17, 12.5, dim, 'right');
    var msg = mode === 'ready' ? (ball.stuck && level > 1 && score && bricks.every(function (b) { return b.alive; }) ? 'Level ' + level + '. ' : '') + 'Click to launch the ball'
      : mode === 'paused' ? 'Paused. Click to go on'
      : mode === 'over' ? 'Game over, score ' + score + '. Click to play again' : '';
    if (msg) {
      var y = Math.min(H - 64, TOP + ROWS * (BH + GAP) + (pad.y - TOP - ROWS * (BH + GAP)) / 2);
      text(msg, W / 2, y, 15, fg);
      if (mode !== 'over') text('Move with the mouse or ← →. Esc closes the game, it stays where you left it', W / 2, y + 24, 12.5, dim);
    }
    box.classList.toggle('playing', mode === 'play');
  }
  function frame(now) {
    raf = 0;
    if (!game.open) return;
    if (document.hidden || $('jobsCard').classList.contains('folded')) pause();
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (!W && !layout()) { raf = requestAnimationFrame(frame); return; }
    step(dt); draw();
    raf = requestAnimationFrame(frame);
  }
  function run() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }

  // The paddle glides to the mouse (quickly, but never jumps), and follows it over the whole
  // window, so coming back into the game doesn't snap it across.
  var aim = null;
  addEventListener('mousemove', function (e) {
    if (!game.open) return;
    var r = cv.getBoundingClientRect();
    aim = Math.max(0, Math.min(W - pad.w, e.clientX - r.left - pad.w / 2));
  });
  cv.addEventListener('mousedown', function (e) { e.preventDefault(); click(); });
  cv.addEventListener('mouseleave', pause); // reaching for something else: the ball waits
  addEventListener('blur', pause);
  addEventListener('keydown', function (e) {
    if (!game.open || /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'Escape') { e.preventDefault(); game.toggle(false); return; }
    if (e.key === ' ') { e.preventDefault(); click(); return; }
    if (/^(ArrowLeft|ArrowRight|a|d)$/.test(e.key)) { keys[e.key] = true; e.preventDefault(); }
  });
  addEventListener('keyup', function (e) { delete keys[e.key]; });
  if (window.ResizeObserver) new ResizeObserver(function () { if (game.open) layout(); }).observe(box);

  // Switching: the window grows first if it must (it's transparent, so that's invisible); the
  // list fades out, the card glides to its new height and the game fades in; back the same way.
  var still = function () { return matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var switchN = 0; // a newer switch cancels the steps of an older one
  function glide(card, from, done) {
    var to = card.offsetHeight;
    if (still() || Math.abs(to - from) < 2) return done();
    card.style.height = from + 'px';
    void card.offsetHeight;
    card.classList.add('anim');
    card.style.height = to + 'px';
    setTimeout(function () { card.classList.remove('anim'); card.style.height = ''; done(); }, 270);
  }
  function fadeOut(e, then) {
    if (still()) return then();
    e.classList.add('fadeout');
    setTimeout(function () { e.classList.remove('fadeout'); then(); }, 140);
  }
  game.toggle = function (on) {
    var card = $('jobsCard'), list = $('list'), my = ++switchN;
    game.open = on;
    keys = {}; aim = null;
    syncPlay();
    if (on) {
      colors();
      if (!bricks.length) restart();
      pause();
      var from = card.offsetHeight;
      lastFit = -1;
      api('/api/window', { text: 'full' }).catch(function () {}).then(function () {
        return new Promise(function (ok) { var t = setTimeout(ok, 250); addEventListener('resize', function f() { removeEventListener('resize', f); clearTimeout(t); setTimeout(ok, 30); }); });
      }).then(function () {
        if (my !== switchN) return;
        fadeOut(list, function () {
          if (my !== switchN) return;
          list.hidden = true;
          card.classList.add('gaming');
          box.hidden = false;
          W = 0; layout();
          run();
          glide(card, from, function () { if (my === switchN) layout(); });
        });
      });
    } else {
      pause();
      fadeOut(box, function () {
        if (my !== switchN) return;
        var from = card.offsetHeight;
        box.hidden = true;
        card.classList.remove('gaming');
        list.hidden = false;
        list.classList.remove('fadein'); void list.offsetWidth; list.classList.add('fadein');
        if (!(state.jobs || []).length) return setGone(true, true); // the list was cleared meanwhile
        glide(card, from, function () { if (my === switchN) windowFit(); });
      });
    }
  };
  $('play').onclick = function () { game.toggle(!game.open); };
})();
// The button shows while something downloads, and while the game is open.
function syncPlay() {
  if (!APP) return;
  var busy = (state.jobs || []).some(function (j) { return j.status === 'queued' || j.status === 'running'; });
  $('play').hidden = !(busy || game.open);
  setText($('playT'), game.open ? 'Back to the list' : 'Play while you wait');
  var tip = game.open ? 'The game waits where you left it (Esc does the same)' : 'A little game while it downloads. It doesn\'t stop when the download ends: finish it, or come back to it later';
  if ($('play').dataset.tip !== tip) $('play').dataset.tip = tip;
}

function refresh() {
  api('/api/state')
    .then(function (s) {
      state = s;
      if ($('msg').textContent === OFFLINE) $('msg').textContent = '';
      render();
    })
    .catch(function () { if ($('msg')) $('msg').textContent = OFFLINE; });
}

refresh();
setInterval(refresh, 700);

// Progress wave, done the way Material 3's LinearWavyProgressIndicator does it (the Morphe
// app uses that one as is):
// - a thick wave with round ends for the done part, a gap, a flat track for the rest;
// - the wave rolls at one steady pace, one wavelength per second;
// - it's flat near the start and the end (up to 10 %, from 95 %) and rises/settles smoothly;
// - the bar follows the progress with a soft spring: progress comes in steps, and a spring
//   keeps its speed when the target moves again, so it glides instead of lurching each time.
// At 100 % (converting, the cover, merging) the line is full and flat, still rolling gently.
// Each running download has a canvas; its state lives here by job id.
var waveTarget = {}, waveState = {};
(function () {
  var css = getComputedStyle(document.documentElement);
  var acc = css.getPropertyValue('--acc').trim();
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now();
  var THICK = 4, AMP = 4, LEN = 30, GAP = 7;   // px: line, wave height (half), wavelength, gap
  var PACE = 2 * Math.PI;                       // rad/s: one wavelength per second
  var K = 4, C = 2 * Math.sqrt(K);              // the spring: very soft (progress comes in big steps every
                                                // 0.7 s; stiffer ones lurched in a simulation), critically damped
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000), most = 0;
    last = now;
    document.querySelectorAll('canvas.wave').forEach(function (cv) {
      var id = cv.dataset.id, t = waveTarget[id] || { p: 0 };
      var st = waveState[id] || (waveState[id] = { phase: 0, shown: t.p, vel: 0, amp: 0 });
      var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (!w) return; // hidden
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      var cx = cv.getContext('2d');
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, w, h);

      if (t.p < st.shown - 5) { st.shown = t.p; st.vel = 0; }    // started over (retry): no slide back
      if (still) st.shown = t.p;
      else {
        st.vel += (K * (t.p - st.shown) - C * st.vel) * dt;
        st.shown = Math.max(st.shown, Math.min(100, st.shown + st.vel * dt)); // never back
        st.phase += dt * PACE;
      }
      var f = st.shown / 100;
      var ampWant = f > 0.1 && f < 0.95 && !still ? AMP : 0;
      st.amp += (ampWant - st.amp) * Math.min(1, dt * 3);
      most = Math.max(most, f);

      var pad = THICK / 2, mid = h / 2, end = w - pad;
      var head = Math.max(pad + THICK, pad + (end - pad) * f);
      cx.lineCap = 'round';
      cx.lineWidth = THICK;
      if (head + GAP < end) {                                     // the track: what's left
        cx.strokeStyle = 'rgba(127,127,127,.28)';
        cx.beginPath(); cx.moveTo(head + GAP + THICK, mid); cx.lineTo(end, mid); cx.stroke();
      }
      cx.strokeStyle = acc;                                       // the wave: what's done
      cx.beginPath();
      for (var x = pad; ; x += 1) {
        var xx = Math.min(x, head);
        var y = mid + Math.sin((xx / LEN) * 2 * Math.PI - st.phase) * st.amp;
        x === pad ? cx.moveTo(xx, y) : cx.lineTo(xx, y);
        if (xx >= head) break;
      }
      cx.stroke();
    });
    // The background speeds up with the progress, smoothed (like Morphe's patcher screen).
    fx.energy += (most - fx.energy) * Math.min(1, dt * 0.8);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// Background: notes and play signs falling slowly and swaying. Far ones are small, faint and slow,
// near ones bigger and faster. They shy away from the mouse, and fall faster while something
// downloads (fx.energy comes from the progress wave). No bursts or confetti: calm, not a show.
// With "reduce motion" on in the system nothing moves.
var fx = { energy: 0 };
(function () {
  var cv = $('fall'), cx = cv.getContext('2d');
  var W, H, ox = 0, oy = 0, dpr, items = [], color, mx = -999, my = -999;
  var GLYPHS = ['♪', '♫', '♩', '▶', '▶', '•'];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    dpr = 1; // a soft background doesn't need sharp pixels; on a 2× screen this is 4× less work
    // The notes fill their box: the whole page in the browser, the list card in ТЯГА's window.
    var r = cv.getBoundingClientRect();
    W = Math.round(r.width) || innerWidth; H = Math.round(r.height) || innerHeight; ox = r.left; oy = r.top;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var css = getComputedStyle(document.documentElement);
    color = css.getPropertyValue('--acc').trim() || '#ff6b2c';
    sprites = {};
    var want = Math.round(W * H / 38000);
    while (items.length < want) items.push(spawn(true));
    items.length = want;
  }
  // Each note is drawn once into a little picture (per glyph and size) and then only stamped:
  // stamping a picture is far cheaper than laying out text every frame, and looks the same.
  var sprites = {};
  function sprite(g, s) {
    var k = g + s, sp = sprites[k];
    if (sp) return sp;
    sp = sprites[k] = document.createElement('canvas');
    sp.width = sp.height = Math.ceil(s * 1.6);
    var c = sp.getContext('2d');
    c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = s + 'px system-ui,sans-serif';
    c.fillText(g, sp.width / 2, sp.height / 2);
    return sp;
  }
  function spawn(anywhere) {
    var z = Math.random(); // 0 = far, 1 = near
    return {
      g: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
      x: Math.random() * W, y: anywhere ? Math.random() * H : -40, ox: 0,
      z: z, s: 10 + Math.round(z * 9) * 2, v: 12 + z * 34, // size px (even: fewer pictures), fall speed px/s
      a: 0.07 + z * 0.2, sway: 10 + Math.random() * 25, f: 0.3 + Math.random() * 0.5,
      ph: Math.random() * 6.28, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.6,
    };
  }
  addEventListener('mousemove', function (e) { mx = e.clientX - ox; my = e.clientY - oy; });
  addEventListener('mouseout', function (e) { if (!e.relatedTarget) mx = my = -999; });
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
    last = now;
    var boost = 1 + fx.energy * 2; // 1× at rest, up to 3× as a download nears its end
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.clearRect(0, 0, W, H);
    if (game.open) { // the game covers the list card: nothing to see
      cx.globalAlpha = 1;
      if (!still) requestAnimationFrame(frame);
      return;
    }
    items.forEach(function (p, i) {
      if (!still) {
        p.y += p.v * boost * dt; p.r += p.vr * boost * dt;
        // Shy of the cursor: pushed sideways, then drift back to their line.
        var x = p.x + p.ox, dx = x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
        if (d2 < 140 * 140) p.ox += (dx >= 0 ? 1 : -1) * (1 - Math.sqrt(d2) / 140) * 260 * dt;
        p.ox *= Math.pow(0.4, dt);
      }
      if (p.y > H + 40) p = items[i] = spawn(false);
      var sp = sprite(p.g, p.s), c = Math.cos(p.r), s = Math.sin(p.r);
      cx.globalAlpha = p.a;
      cx.setTransform(c, s, -s, c, p.x + p.ox + Math.sin(t * p.f + p.ph) * p.sway, p.y);
      cx.drawImage(sp, -sp.width / 2, -sp.height / 2);
    });

    if (!still) requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(cv.parentNode);
  size();
  requestAnimationFrame(frame);
})();
</script></body></html>
