# Checks every pull request and every push to main: formatting, vet, tests,
# and that TYAGA still builds for Windows, the system it's released for.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ffmpeg for the merge tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on: $unformatted"; exit 1; fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Tests
        run: go test ./...

      # The same step the release runs. Its outcome goes into the annotations,
      # so a broken resource build shows up in the PR, not at release time.
      - name: Windows resources (icon + version)
        run: |
          if out=$(winres/make.sh v1.2.3 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null && winres/make.sh v1.2.3 2>&1; }); then
            echo "::notice::winres: $(echo "$out" | tr '\n' ' ')"
          else
            echo "::error::winres failed: $(echo "$out" | tr '\n' ' ')"; exit 1
          fi
          git checkout -- rsrc_windows_*.syso # keep the committed ones

      - name: Build for Windows
        run: |
          for arch in amd64 arm64; do
            echo "windows/$arch"
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -tags production -o /dev/null .
          done

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One typo in the page's script and the page does nothing at all, while every Go test passes.
      - name: Page script compiles
        run: node stand/syntax.js

      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      # ТЯГА on the stand (a fake yt-dlp, no network) and the layout checks in every state:
      # empty, a link pasted, downloads running, done and failed; dark and light, English and
      # Russian, the real width and a narrow one.
      # Then the scenarios (stand/scenarios.js): the page used the way people use it.
      - name: Layout checks and scenarios on the stand
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          url=$(stand/run.sh)
          echo "stand: $url"
          if [ -z "$url" ]; then echo "::error title=Stand::the stand did not start: $(tail -c 1500 /tmp/tyaga-stand/app.log | tr -s '[:space:]' ' ')"; exit 1; fi
          node stand/ci.js "$url"
          node stand/scenarios.js "$url"

      - name: The stand's log (when something failed)
        if: failure()
        run: cat /tmp/tyaga-stand/app.log || true
