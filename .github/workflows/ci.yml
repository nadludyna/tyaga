# The Go side, on every pull request and push to main that touches it: formatting, vet, tests,
# and that ТЯГА still builds for Windows, the system it's released for. A change to the docs,
# the page or the stand alone doesn't run it (page.yml checks those).
# No check is required to merge (the ruleset on main asks for none), so a workflow that doesn't
# run never leaves a pull request waiting. If one is ever made required, this filter has to go.
name: Go

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'winres/**'
      - '*.syso'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'winres/**'
      - '*.syso'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ffmpeg for the merge tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on: $unformatted"; exit 1; fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Tests
        run: go test ./...

      # The same step the release runs. Its outcome goes into the annotations,
      # so a broken resource build shows up in the PR, not at release time.
      - name: Windows resources (icon + version)
        run: |
          if out=$(winres/make.sh v1.2.3 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null && winres/make.sh v1.2.3 2>&1; }); then
            echo "::notice::winres: $(echo "$out" | tr '\n' ' ')"
          else
            echo "::error::winres failed: $(echo "$out" | tr '\n' ' ')"; exit 1
          fi
          git checkout -- rsrc_windows_*.syso # keep the committed ones

      - name: Build for Windows
        run: |
          for arch in amd64 arm64; do
            echo "windows/$arch"
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -tags production -o /dev/null .
          done
