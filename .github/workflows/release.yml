# Making a release: Actions → Release → Run workflow → enter a version, e.g. v1.0.0.
# Builds TYAGA for Windows (x64 and ARM) and puts the zips on the Releases page.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like v1.0.0 (got \"$VERSION\")"; exit 1
          fi

      # Stamps the version into the exe's "Properties → Details". Not worth failing a release
      # over: without it the exe still gets the icon, just with the version from the repo.
      - name: Icon and version for the Windows exe
        env:
          VERSION: ${{ inputs.version }}
        run: |
          winres/make.sh "$VERSION" 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null
            winres/make.sh "$VERSION" 2>&1
          } || echo "::warning::Couldn't stamp the version into the Windows exe; building with the committed resources."

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            name="tyaga-$VERSION-windows-$arch"
            mkdir -p "build/$name/tyaga"
            # -H=windowsgui: no console window
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -tags production -trimpath \
              -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o "build/$name/tyaga/tyaga.exe" .
            (cd "build/$name" && zip -qr "../../dist/$name.zip" tyaga)
          done
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "TYAGA $VERSION" --generate-notes
